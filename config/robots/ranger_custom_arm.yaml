# Ranger Mini Mobile Manipulator - Generic Custom Manipulator Profile
platform:
  name: "ranger_mini"
  type: "mobile_manipulator"
  description: "AgileX Ranger Mini 4WIS Mobile Base + Custom Attachable Manipulator"

manipulator:
  enabled: true
  type: "custom_arm"
  interface: "usb_serial"
  port: "/dev/ttyUSB_ARM"
  baudrate: 115200
  can_interface: ""
  degrees_of_freedom: 6
  gripper: "custom"
  urdf_mount: "manipulator_mount"
  controller: "custom_arm_controller"

payload:
  max_capacity_kg: 50.0
  arm_weight_kg: 5.0
  arm_payload_kg: 2.0
  usable_top_deck_payload_kg: 43.0

safety:
  emergency_stop_behavior: "coordinated_halt"
  obstacle_standoff_distance_m: 0.50
  max_linear_speed_mps: 0.8
  max_angular_speed_radps: 1.2
  auto_stow_on_nav: true

capabilities:
  can_navigate: true
  can_slam: true
  can_dock: true
  can_pick: true
  can_place: true
  can_move_arm: true
  can_inspect: true
