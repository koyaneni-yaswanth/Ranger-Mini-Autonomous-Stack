# Ranger Mini Mobile Manipulator - AgileX Piper 6-DOF Profile
platform:
  name: "ranger_mini"
  type: "mobile_manipulator"
  description: "AgileX Ranger Mini 4WIS Mobile Base + Piper 6-DOF Manipulator"

manipulator:
  enabled: true
  type: "piper"
  interface: "can"
  can_interface: "can0"
  port: ""
  baudrate: 1000000
  degrees_of_freedom: 6
  gripper: "parallel"
  urdf_mount: "manipulator_mount"
  controller: "piper_arm_controller"

payload:
  max_capacity_kg: 50.0
  arm_weight_kg: 4.2
  arm_payload_kg: 1.5
  usable_top_deck_payload_kg: 44.3

safety:
  emergency_stop_behavior: "coordinated_halt"
  obstacle_standoff_distance_m: 0.45
  max_linear_speed_mps: 1.0
  max_angular_speed_radps: 1.5
  auto_stow_on_nav: true

capabilities:
  can_navigate: true
  can_slam: true
  can_dock: true
  can_pick: true
  can_place: true
  can_move_arm: true
  can_inspect: true
