# NERO Autonomous Mobile Robot (AMR) - Base-Only Profile
platform:
  name: "nero"
  type: "industrial_amr"
  description: "NERO Heavy-Duty Industrial Mobile Robot"

manipulator:
  enabled: false
  type: "none"
  interface: ""
  port: ""
  baudrate: 0
  can_interface: ""

payload:
  max_capacity_kg: 100.0
  rated_payload_kg: 80.0
  chassis_weight_kg: 45.0

safety:
  emergency_stop_behavior: "hard_stop"
  obstacle_standoff_distance_m: 0.40
  max_linear_speed_mps: 1.2
  max_angular_speed_radps: 1.8

capabilities:
  can_navigate: true
  can_slam: true
  can_dock: true
  can_pick: false
  can_place: false
  can_move_arm: false
  can_inspect: true
