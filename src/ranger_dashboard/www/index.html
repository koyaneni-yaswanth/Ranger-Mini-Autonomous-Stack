<!DOCTYPE html>
<html>
<head>
    <title>Ranger Mini Operator Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ROSLibJS -->
    <script src="https://static.robotwebtools.org/EventEmitter2/current/eventemitter2.min.js"></script>
    <script src="https://static.robotwebtools.org/roslibjs/current/roslib.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">Ranger Mini <span class="text-blue-500">Dashboard</span></h1>
        <div class="flex items-center gap-4 mb-8">
            <div id="status-indicator" class="w-4 h-4 rounded-full bg-red-500"></div>
            <p id="status-text" class="text-gray-400">Disconnected from ROS 2</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Camera Feed -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-semibold mb-4">Live Camera Feed</h2>
                <!-- Web Video Server Stream -->
                <img id="camera-feed" src="" alt="Camera Feed Offline" 
                     class="w-full rounded-lg border border-slate-600 bg-black aspect-video object-cover"/>
            </div>

            <!-- Controls -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-semibold mb-4">Mission Control</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button onclick="startPatrol()" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">
                        Start Patrol Mission
                    </button>
                    <button onclick="stopRobot()" class="bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold transition">
                        EMERGENCY STOP
                    </button>
                </div>

                <div class="mt-4">
                    <h3 class="text-lg font-medium text-gray-300 mb-2">Live Odometry</h3>
                    <div class="bg-slate-900 p-4 rounded font-mono text-sm text-green-400">
                        X: <span id="odom-x">0.00</span> m<br>
                        Y: <span id="odom-y">0.00</span> m
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
