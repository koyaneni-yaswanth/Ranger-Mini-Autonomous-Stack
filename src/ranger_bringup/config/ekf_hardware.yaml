ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometry from the AgileX hardware base driver
    odom0: /odom
    odom0_config: [true,  true,  false,  # X, Y, Z
                   false, false, true,   # Roll, Pitch, Yaw
                   true,  true,  false,  # dX, dY, dZ
                   false, false, true,   # dRoll, dPitch, dYaw
                   false, false, false]  # ddX, ddY, ddZ
    odom0_differential: false
    odom0_queue_size: 10

    # IMU from Livox Mid-360
    imu0: /livox/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
